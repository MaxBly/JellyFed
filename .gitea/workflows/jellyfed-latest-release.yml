name: JellyFed latest test release

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  workflow_dispatch:

jobs:
  build-latest:
    name: Build and publish latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      LATEST_TAG: latest
      GITEA_SERVER_URL: ${{ github.server_url }}
      GITEA_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Read build metadata
        id: meta
        run: |
          BASE_VERSION=$(grep '^version:' build.yaml | awk '{print $2}' | tr -d '"')
          TARGET_ABI=$(grep '^targetAbi:' build.yaml | awk '{print $2}' | tr -d '"')
          STAMP=$(date -u +%s)

          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$BASE_VERSION"
          CI_VERSION="${MAJOR}.${MINOR}.${PATCH}.${STAMP}"
          ZIP_NAME="jellyfed_${CI_VERSION}.zip"
          REPO_URL="${GITEA_SERVER_URL%/}/${GITEA_REPOSITORY}"
          MANIFEST_URL="${REPO_URL}/releases/download/${LATEST_TAG}/manifest.json"

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$CI_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_abi=$TARGET_ABI" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "manifest_url=$MANIFEST_URL" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: dotnet build Jellyfin.Plugin.JellyFed -c Release -o _build --nologo -v quiet

      - name: Package ZIP
        run: |
          mkdir -p repo
          cd _build
          zip -q "../repo/${{ steps.meta.outputs.zip_name }}" Jellyfin.Plugin.JellyFed.dll

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum "repo/${{ steps.meta.outputs.zip_name }}" | awk '{print $1}')
          echo "md5=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Generate Jellyfin manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_ABI: ${{ steps.meta.outputs.target_abi }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          CHECKSUM: ${{ steps.checksum.outputs.md5 }}
          REPO_URL: ${{ steps.meta.outputs.repo_url }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          target_abi = os.environ["TARGET_ABI"]
          zip_name = os.environ["ZIP_NAME"]
          checksum = os.environ["CHECKSUM"]
          repo_url = os.environ["REPO_URL"].rstrip("/")
          base_version = os.environ["BASE_VERSION"]
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.0000000Z")
          source_url = f"{repo_url}/releases/download/latest/{zip_name}"

          build_yaml = Path("build.yaml").read_text(encoding="utf-8")

          def scalar(name, default=""):
              match = re.search(rf'^{name}:\s*"?([^"\n]+)"?\s*$', build_yaml, re.MULTILINE)
              return match.group(1).strip() if match else default

          def folded(name, default=""):
              lines = build_yaml.splitlines()
              capture = False
              out = []
              for line in lines:
                  if not capture:
                      if re.match(rf'^{name}:\s*(>|\|)?\s*$', line):
                          capture = True
                      continue
                  if line.startswith(" ") or line.startswith("\t"):
                      out.append(line.strip())
                      continue
                  break
              return " ".join(part for part in out if part).strip() or default

          name = scalar("name", "JellyFed")
          guid = scalar("guid", "ff0164d7-e8c0-44c1-bc61-45017125a155")
          overview = "[Gitea latest] " + scalar("overview", "Native federation between Jellyfin instances")
          description = folded("description", "JellyFed connects multiple Jellyfin servers together.")
          owner = scalar("owner", "MaxBly")
          changelog = folded("changelog", f"Build {base_version}.")

          manifest = [
              {
                  "category": scalar("category", "General"),
                  "guid": guid,
                  "name": name,
                  "description": description,
                  "overview": overview,
                  "owner": owner,
                  "targetAbi": target_abi,
                  "timestamp": timestamp,
                  "versions": [
                      {
                          "version": version,
                          "changelog": f"[Gitea latest] {changelog}",
                          "targetAbi": target_abi,
                          "sourceUrl": source_url,
                          "checksum": checksum,
                          "timestamp": timestamp,
                      }
                  ],
              }
          ]

          Path("repo/manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Manifest: {repo_url}/releases/download/latest/manifest.json")
          print(f"ZIP:      {source_url}")
          PY

      - name: Publish latest Gitea release assets
        env:
          NODE_OPTIONS: "--experimental-fetch"
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          server_url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITEA_TOKEN }}
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: JellyFed latest test build
          body: |
            Release flottante générée par Gitea Actions pour Jellyfin de test.

            Manifest Jellyfin stable : `${{ steps.meta.outputs.manifest_url }}`

            Cette release est mise à jour à chaque build CI.
          prerelease: true
          files: |
            repo/manifest.json
            repo/${{ steps.meta.outputs.zip_name }}

      - name: Summary
        run: |
          echo "Manifest Jellyfin:"
          echo "${{ steps.meta.outputs.manifest_url }}"
          echo ""
          echo "ZIP asset:"
          echo "${{ steps.meta.outputs.repo_url }}/releases/download/latest/${{ steps.meta.outputs.zip_name }}"
